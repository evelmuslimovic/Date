<!DOCTYPE html>
<html lang="bs">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Jedno pitanje za tebe ❤️</title>


<style>

/* =========================
   OSNOVNI IZGLED
========================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

}

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        linear-gradient(
            135deg,
            #ffd6e7,
            #fff0f6,
            #ffd1e3
        );

    color: #5a1836;

}


/* =========================
   POZADINSKA SRCA
========================= */

.heart {

    position: absolute;

    font-size: 25px;

    opacity: 0.45;

    animation:
        floatHeart 8s linear infinite;

    pointer-events: none;

}


@keyframes floatHeart {

    0% {

        transform:
            translateY(110vh)
            rotate(0deg);

        opacity: 0;

    }

    15% {

        opacity: 0.5;

    }

    100% {

        transform:
            translateY(-20vh)
            rotate(360deg);

        opacity: 0;

    }

}


/* =========================
   GLAVNA KARTICA
========================= */

.card {

    width: 90%;

    max-width: 560px;

    min-height: 430px;

    padding: 45px 25px;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    background:
        rgba(255,255,255,0.88);

    border-radius: 30px;

    box-shadow:
        0 20px 70px
        rgba(120,30,70,0.20);

    position: relative;

    z-index: 2;

}


/* =========================
   SADRŽAJ
========================= */

.content {

    width: 100%;

}


.emoji {

    font-size: 65px;

    animation:
        pulse 1.5s infinite;

}


@keyframes pulse {

    0% {

        transform: scale(1);

    }

    50% {

        transform: scale(1.12);

    }

    100% {

        transform: scale(1);

    }

}


h1 {

    font-size:
        clamp(29px, 7vw, 46px);

    line-height: 1.1;

    margin:
        18px 0 12px;

    color: #691b3c;

}


p {

    font-size: 18px;

    color: #89536b;

    line-height: 1.5;

}


/* =========================
   DUGMAD
========================= */

button {

    border: none;

    border-radius: 50px;

    padding:
        15px 30px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    transition:
        transform 0.2s,
        box-shadow 0.2s;

    -webkit-tap-highlight-color:
        transparent;

}


button:hover {

    transform: scale(1.06);

}


/* =========================
   DA / NE
========================= */

.button-area {

    position: relative;

    height: 150px;

    margin-top: 20px;

}


#yesButton {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-115%, -50%);

    background:
        #ff4f8b;

    color: white;

    box-shadow:
        0 8px 25px
        rgba(255,79,139,0.35);

}


#yesButton:hover {

    transform:
        translate(-115%, -50%)
        scale(1.08);

}


#noButton {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(10%, -50%);

    background:
        #eeeeee;

    color: #666;

}


/* =========================
   DATUMI
========================= */

.date-buttons {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 15px;

    margin-top: 25px;

}


.date-button {

    width: 230px;

    background:
        #ff4f8b;

    color: white;

    box-shadow:
        0 8px 20px
        rgba(255,79,139,0.25);

}


.date-button:hover {

    transform: scale(1.07);

}


/* =========================
   ZAVRŠNA PORUKA
========================= */

.selected-date {

    font-size: 34px;

    font-weight: bold;

    color: #ff3f82;

    margin-top: 20px;

}


.final-message {

    font-size:
        clamp(25px, 6vw, 38px);

    font-weight: bold;

    color: #ff3f82;

    margin-top: 15px;

}


.final-subtitle {

    font-size: 18px;

    color: #8a5269;

}


/* =========================
   SAKRIVANJE
========================= */

.hidden {

    display: none;

}


/* =========================
   MOBITEL
========================= */

@media (max-width: 600px) {

    .card {

        width: 92%;

        min-height: 420px;

        padding:
            35px 18px;

    }


    .emoji {

        font-size: 58px;

    }


    h1 {

        font-size: 31px;

    }


    p {

        font-size: 17px;

    }


    #yesButton {

        transform:
            translate(-110%, -50%);

    }


    #yesButton:hover {

        transform:
            translate(-110%, -50%)
            scale(1.05);

    }

}


/* =========================
   FINAL ANIMACIJA
========================= */

.final-screen {

    animation:
        finalAppear 0.8s ease;

}


@keyframes finalAppear {

    from {

        opacity: 0;

        transform:
            scale(0.7);

    }

    to {

        opacity: 1;

        transform:
            scale(1);

    }

}

</style>

</head>


<body>


<!-- =========================
     POZADINSKA SRCA
========================= -->

<div class="heart"
style="left:5%; animation-delay:0s;">
❤️
</div>

<div class="heart"
style="left:18%; animation-delay:2s;">
💕
</div>

<div class="heart"
style="left:32%; animation-delay:4s;">
💗
</div>

<div class="heart"
style="left:48%; animation-delay:1s;">
❤️
</div>

<div class="heart"
style="left:65%; animation-delay:3s;">
💖
</div>

<div class="heart"
style="left:82%; animation-delay:5s;">
💕
</div>

<div class="heart"
style="left:95%; animation-delay:1.5s;">
❤️
</div>


<!-- =========================
     GLAVNA KARTICA
========================= -->

<div class="card">

<div class="content">


<!-- =========================
     PRVO PITANJE
========================= -->

<div id="questionScreen">

    <div class="emoji">
        💗
    </div>


    <h1>
        Hoćeš li izaći sa mnom na dejt?
    </h1>


    <p>
        Dobro razmisli... 😏
    </p>


    <div
        class="button-area"
        id="buttonArea"
    >

        <button
            id="yesButton"
        >
            DA ❤️
        </button>


        <button
            id="noButton"
        >
            NE 😢
        </button>

    </div>


    <p>

        <small>
            P.S. Ne znam zašto je "NE"
            toliko teško uhvatiti... 😂
        </small>

    </p>

</div>



<!-- =========================
     IZBOR DATUMA
========================= -->

<div
    id="dateScreen"
    class="hidden"
>

    <div class="emoji">
        🥰
    </div>


    <h1>
        Znala sam da ćeš reći DA! ❤️
    </h1>


    <p>

        A sada još samo jedno pitanje... 👀

        <br><br>

        <strong>
            Koji datum ti više odgovara?
        </strong>

    </p>


    <div class="date-buttons">


        <button
            class="date-button"
            onclick="chooseDate('30.10.')"
        >

            📅 30.10.

        </button>


        <button
            class="date-button"
            onclick="chooseDate('6.11.')"
        >

            📅 6.11.

        </button>


    </div>

</div>



<!-- =========================
     ZAVRŠNA PORUKA
========================= -->

<div
    id="finalScreen"
    class="hidden final-screen"
>

    <div class="emoji">
        🥰
    </div>


    <p class="selected-date"
       id="selectedDate">
    </p>


    <div class="final-message">

        Vidimo se u Istanbulu 🥰🇹🇷❤️

    </div>


    <p class="final-subtitle">

        Jedva čekam. ✈️❤️

    </p>


</div>


</div>

</div>



<script>


/* =========================
   ELEMENTI
========================= */

const noButton =
    document.getElementById("noButton");

const yesButton =
    document.getElementById("yesButton");

const buttonArea =
    document.getElementById("buttonArea");

const questionScreen =
    document.getElementById("questionScreen");

const dateScreen =
    document.getElementById("dateScreen");

const finalScreen =
    document.getElementById("finalScreen");

const selectedDate =
    document.getElementById("selectedDate");


/* =========================
   BJEŽANJE "NE" DUGMETA
========================= */

function moveNoButton() {

    const area =
        buttonArea.getBoundingClientRect();

    const button =
        noButton.getBoundingClientRect();


    const maxX =
        area.width - button.width - 10;

    const maxY =
        area.height - button.height - 10;


    const randomX =
        Math.max(
            5,
            Math.random() * maxX
        );


    const randomY =
        Math.max(
            5,
            Math.random() * maxY
        );


    noButton.style.left =
        randomX + "px";

    noButton.style.top =
        randomY + "px";

    noButton.style.transform =
        "none";

}


/* =========================
   RAČUNAR
========================= */

noButton.addEventListener(
    "mouseenter",
    moveNoButton
);


/* =========================
   MOBITEL
========================= */

noButton.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        moveNoButton();

    }
);


/* =========================
   AKO NEKAKO KLIKNE
========================= */

noButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        moveNoButton();

    }
);


/* =========================
   KLIK NA DA
========================= */

yesButton.addEventListener(
    "click",
    function() {

        questionScreen
            .classList
            .add("hidden");


        dateScreen
            .classList
            .remove("hidden");

    }
);


/* =========================
   IZBOR DATUMA
========================= */

function chooseDate(date) {

    dateScreen
        .classList
        .add("hidden");


    finalScreen
        .classList
        .remove("hidden");


    selectedDate.innerHTML =
        date + " ❤️";


    createHeartExplosion();

}


/* =========================
   EKSPLOZIJA SRCA
========================= */

function createHeartExplosion() {

    const hearts = [
        "❤️",
        "💕",
        "💗",
        "💖",
        "🥰",
        "✨"
    ];


    for (
        let i = 0;
        i < 45;
        i++
    ) {

        const heart =
            document.createElement("div");


        heart.innerHTML =
            hearts[
                Math.floor(
                    Math.random()
                    * hearts.length
                )
            ];


        heart.style.position =
            "fixed";


        heart.style.left =
            "50%";


        heart.style.top =
            "50%";


        heart.style.fontSize =
            (
                18 +
                Math.random() * 25
            ) + "px";


        heart.style.zIndex =
            "100";


        heart.style.pointerEvents =
            "none";


        document.body
            .appendChild(heart);


        const angle =
            Math.random()
            * Math.PI
            * 2;


        const distance =
            150 +
            Math.random() * 350;


        const x =
            Math.cos(angle)
            * distance;


        const y =
            Math.sin(angle)
            * distance;


        const animation =
            heart.animate(

                [

                    {
                        transform:
                            "translate(-50%, -50%) scale(0.5)",

                        opacity: 1

                    },

                    {

                        transform:
                            `translate(
                                calc(-50% + ${x}px),
                                calc(-50% + ${y}px)
                            )
                            scale(1.2)`,

                        opacity: 0

                    }

                ],

                {

                    duration:
                        1000 +
                        Math.random() * 700,

                    easing:
                        "ease-out"

                }

            );


        animation.onfinish =
            function() {

                heart.remove();

            };

    }

}

</script>

</body>

</html>
